name: tests

# The test suites are deliberately runnable with no video, no DuckDB and no model
# weights: the scoreboard OCR snapshots and the ShuttleSet labels they check against are
# both committed to the repo. That is what makes CI possible for a CV pipeline at all.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Intentionally NOT requirements.txt — that pulls torch, ultralytics and opencv
      # (gigabytes, and irrelevant here). Keeping the install to what the suites actually
      # import is also the guard: if a test ever grows a heavyweight dependency, this job
      # fails loudly instead of quietly needing a multi-gigabyte runner.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy duckdb pandas pyyaml

      - name: Score decoding (rules, repair, expand, scorelines)
        run: PYTHONPATH=src python tests/test_score_seq.py

      - name: Doubles (slot identity, roles, segmentation, sets)
        run: PYTHONPATH=src python tests/test_doubles.py
